<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2f3b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Cocon">
<title>Le Cocon</title>
<style>
:root{--linen:#f4ede1;--forest:#2f3b2d;--sage:#7c9473;--rose:#d8a6a0;--caramel:#c08a4e;--cream:#fff8ed;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#1e211c;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif;color:var(--forest)}button{font:inherit;color:inherit}#app{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:var(--linen)}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{background:#cfa982}.room{position:absolute;inset:0 0 72px;background:url('https://raw.githubusercontent.com/DamCfr/le-cocon/main/assets/room.webp') center 52%/cover no-repeat}.room:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(39,26,17,.12),transparent 34%,rgba(39,26,17,.11))}.top{position:absolute;z-index:10;top:max(env(safe-area-inset-top),8px);left:16px;right:16px;text-align:center;color:#fff7e9;text-shadow:0 2px 12px #4a2f20}.moon{font:600 18px var(--serif)}h1{font:600 42px/.95 var(--serif);margin:2px 0}.subtitle{font:500 13px var(--serif);margin:4px 0 8px}.score{margin:auto;width:218px;height:54px;border-radius:28px;background:rgba(255,248,237,.93);display:flex;align-items:center;justify-content:center;gap:12px;color:#3d332b;text-shadow:none;box-shadow:0 8px 24px rgba(54,34,20,.2);border:1px solid rgba(255,255,255,.5)}.score b{font:600 27px var(--serif);font-variant-numeric:tabular-nums}.score small{font:600 10px var(--serif);opacity:.68}.gem{width:29px;height:29px;border-radius:50%;background:radial-gradient(circle,#efe2a8 0 24%,#d8a6a0 27% 49%,#a9b99d 52% 66%,transparent 69%)}.boost{position:absolute;left:50%;transform:translateX(-50%);margin-top:5px;background:rgba(76,53,38,.93);padding:5px 10px;border-radius:14px;font:600 11px var(--serif);opacity:0;transition:.2s}.boost.show{opacity:1}.tap{position:absolute;z-index:4;inset:0 0 160px;touch-action:manipulation}
.decor{position:absolute;z-index:5;opacity:0;transform:translateY(12px) scale(.88);transition:.55s cubic-bezier(.2,1.25,.35,1);pointer-events:none}.decor.show{opacity:1;transform:none}.plant{left:7%;bottom:24%;font-size:72px;filter:drop-shadow(0 9px 10px rgba(53,35,21,.2))}.sofa{left:28%;bottom:27%;font-size:105px;filter:drop-shadow(0 10px 13px rgba(53,35,21,.22))}.books{right:10%;bottom:27%;font-size:50px}.lamp{right:6%;bottom:36%;font-size:62px}.tea{right:30%;bottom:23%;font-size:45px}.plaid{left:34%;bottom:29%;font-size:52px}.garland{left:29%;top:34%;font-size:34px;letter-spacing:9px;filter:drop-shadow(0 0 8px #ffd58d)}
.catWrap{position:absolute;z-index:9;right:10%;bottom:20%;width:150px;height:145px;display:none;place-items:center;pointer-events:none}.catWrap.show{display:grid}.cat{font-size:104px;line-height:1;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 12px 12px rgba(45,28,17,.28));transition:.12s;user-select:none}.cat:active{transform:scale(.92)}.cat.ready{animation:glow 2s ease-in-out infinite}.cat.sleep{opacity:.66;filter:saturate(.6) drop-shadow(0 10px 10px rgba(45,28,17,.2))}@keyframes glow{50%{filter:drop-shadow(0 0 15px rgba(255,220,145,.9)) drop-shadow(0 12px 12px rgba(45,28,17,.2))}}.heart{position:absolute;font-size:28px;color:#ffd0ca;animation:up 1s ease-out forwards;text-shadow:0 2px 8px #5a3825}.float{position:absolute;z-index:30;color:#fff8e9;font:600 21px var(--serif);text-shadow:0 2px 9px #4a2e1d;pointer-events:none;animation:up 1s ease-out forwards}@keyframes up{to{transform:translateY(-65px);opacity:0}}
.homeBottom{position:absolute;z-index:12;left:8px;right:8px;bottom:78px}.whisper{text-align:center;color:#fff4df;font:italic 14px var(--serif);text-shadow:0 2px 9px #4a2e1d;margin-bottom:7px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;background:rgba(255,248,237,.92);border-radius:19px;box-shadow:0 9px 25px rgba(50,31,18,.2);backdrop-filter:blur(8px)}.quick button{border:0;border-radius:12px;background:rgba(255,255,255,.25);padding:5px 2px;min-width:0}.quick button.lock{opacity:.43}.quick button.owned{opacity:.56}.qi{font-size:26px;height:30px}.qn{font:600 10px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qc{font-size:9px;font-weight:700;margin-top:2px;color:#72533d}
nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:72px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,248,237,.96);border-top:1px solid rgba(110,85,60,.15);box-shadow:0 -7px 20px rgba(56,38,25,.13)}nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--serif);opacity:.56}nav button.active{opacity:1;color:#76513a}.navIcon{font-size:20px}
.panel{background:linear-gradient(to bottom,#6e4d39 0 35%,var(--linen) 53%);padding-top:max(calc(env(safe-area-inset-top) + 18px),28px)}.panelHead{text-align:center;color:#fff2df;text-shadow:0 2px 10px rgba(40,25,15,.7)}.panelHead h2{font:600 42px/1 var(--serif);margin:5px}.panelHead p{font:500 13px var(--serif);margin:0}.balance{display:inline-block;margin-top:8px;padding:6px 13px;border-radius:16px;background:rgba(255,248,237,.92);color:#46372c;text-shadow:none;font:600 13px var(--serif)}.sheet{position:absolute;left:0;right:0;top:32%;bottom:72px;background:linear-gradient(#fff8ee,#f4ede1);border-radius:25px 25px 0 0;padding:16px 12px;overflow:auto;box-shadow:0 -10px 24px rgba(49,30,18,.16)}.cards{display:grid;gap:9px}.card{background:rgba(255,255,255,.7);border:1px solid rgba(124,148,115,.24);border-radius:16px;padding:12px;box-shadow:0 5px 15px rgba(65,45,30,.07)}.shopCard{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}.shopEmoji{font-size:34px;text-align:center}.shopCard h3{font:600 15px var(--serif);margin:0 0 2px}.muted{font-size:11px;opacity:.62}.buy{border:0;border-radius:11px;background:var(--forest);color:#fff7e9;padding:8px 10px;font-weight:700;font-size:11px}.buy:disabled{opacity:.25}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{border:0;padding:7px 10px;border-radius:12px;background:#e9dfd1;font:600 11px var(--serif)}.tabs button.active{background:var(--forest);color:#fff}.collection{display:grid;grid-template-columns:45px 1fr;gap:10px;align-items:center}.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#efe6d8;font-size:21px}.task{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center}.check{width:31px;height:31px;border:0;border-radius:50%;background:var(--sage);color:white;font-weight:800}.check:disabled{opacity:.28}.journal h3{font:600 15px var(--serif);margin:0 0 4px}.date{font-size:9px;opacity:.45;margin-top:5px}.toast{position:absolute;z-index:80;top:max(calc(env(safe-area-inset-top) + 10px),18px);left:50%;transform:translate(-50%,-14px);background:#2f3b2d;color:#fff8e9;border-radius:18px;padding:9px 15px;font:600 12px var(--serif);opacity:0;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body><div id="app">
<section id="home" class="screen active"><div class="room"></div><div class="top"><div class="moon">☾</div><h1>Le Cocon</h1><div class="subtitle">ton coin tranquille</div><div class="score"><span class="gem"></span><div><small>SÉRÉNITÉ</small><br><b id="score">0</b></div></div><div id="boost" class="boost">×2 · Loupiote ronronne</div></div><div id="tap" class="tap"></div><div id="plant" class="decor plant">🌿</div><div id="sofa" class="decor sofa">🛋️</div><div id="books" class="decor books">📚</div><div id="lamp" class="decor lamp">🪔</div><div id="tea" class="decor tea">🫖</div><div id="plaid" class="decor plaid">🧶</div><div id="garland" class="decor garland">✦ ✦ ✦</div><div id="catWrap" class="catWrap"><div id="cat" class="cat">🐈‍⬛</div></div><div class="homeBottom"><div id="whisper" class="whisper">chaque tape, un instant de calme</div><div id="quick" class="quick"></div></div></section>
<section id="shop" class="screen panel"><div class="panelHead"><div>☾</div><h2>Boutique</h2><p>quelques petites choses pour habiter le silence</p><span class="balance">✦ <b class="mirror">0</b></span></div><div class="sheet"><div id="shopList" class="cards"></div></div></section>
<section id="collections" class="screen panel"><div class="panelHead"><div>☾</div><h2>Collections</h2><p>les souvenirs qui donnent une âme au Cocon</p></div><div class="sheet"><div id="collectionList" class="cards"></div></div></section>
<section id="tomorrow" class="screen panel"><div class="panelHead"><div>☾</div><h2>Demain</h2><p>pas une to-do. juste trois petits pas.</p></div><div class="sheet"><div id="taskList" class="cards"></div></div></section>
<nav><button class="active" data-go="home"><span class="navIcon">⌂</span>Cocon</button><button data-go="shop"><span class="navIcon">🛍</span>Boutique</button><button data-go="collections"><span class="navIcon">✦</span>Collections</button><button data-go="tomorrow"><span class="navIcon">☀︎</span>Demain</button></nav><div id="toast" class="toast"></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],SAVE='le-cocon-web-v2';const ITEMS=[{id:'plant',name:'Une plante verte',icon:'🌿',cost:40,passive:.33,bonus:'+1 toutes les 3 s'},{id:'cat',name:'Loupiote',icon:'🐈‍⬛',cost:80,bonus:'caresse-la : gains ×2'},{id:'sofa',name:'Canapé confortable',icon:'🛋️',cost:150,tap:1,bonus:'+1 par tape'},{id:'books',name:'Pile de livres',icon:'📚',cost:300,passive:.5,bonus:'+2 toutes les 4 s'},{id:'lamp',name:'Lampe du soir',icon:'🪔',cost:500,passive:.5,bonus:'le Cocon se réchauffe'},{id:'tea',name:'Théière',icon:'🫖',cost:850,passive:1,bonus:'+1 sérénité / s'},{id:'plaid',name:'Plaid épais',icon:'🧶',cost:1300,tap:2,bonus:'+2 par tape'},{id:'garland',name:'Guirlande lune',icon:'✨',cost:2100,passive:2,bonus:'+2 sérénité / s'}];const COLLECTIONS=[['premier','Premier souffle','🌙',s=>s.total>=1],['plante','Ça pousse','🌿',s=>s.owned.plant],['loupiote','Employée du mois','🐈‍⬛',s=>s.owned.cat],['lecture','Un livre et rien d’autre','📚',s=>s.owned.books],['cocon','Ça ressemble à chez toi','🕯️',s=>Object.keys(s.owned).length>=5]];const TASKS=[['tap','Prendre un moment','taper 20 fois','☕',30,s=>s.taps>=20],['cat','Caresser Loupiote','quand madame est disponible','🐾',50,s=>s.pets>=1],['buy','Ajouter une douceur','installer 3 objets','🌿',75,s=>Object.keys(s.owned).length>=3]];let s={points:0,total:0,taps:0,pets:0,owned:{},collections:{},tasks:{},boostUntil:0,coolUntil:0,last:Date.now()};try{const x=JSON.parse(localStorage.getItem(SAVE));if(x)s={...s,...x,owned:x.owned||{},collections:x.collections||{},tasks:x.tasks||{}}}catch(e){}const save=()=>{s.last=Date.now();localStorage.setItem(SAVE,JSON.stringify(s))};const fmt=n=>Math.floor(n).toLocaleString('fr-FR');const pps=()=>ITEMS.reduce((a,i)=>a+(s.owned[i.id]?(i.passive||0):0),0);const power=()=>1+ITEMS.reduce((a,i)=>a+(s.owned[i.id]?(i.tap||0):0),0);let tt;function toast(t){clearTimeout(tt);$('#toast').textContent=t;$('#toast').classList.add('show');tt=setTimeout(()=>$('#toast').classList.remove('show'),2400)}function update(){const n=fmt(s.points);$('#score').textContent=n;$$('.mirror').forEach(x=>x.textContent=n);ITEMS.forEach(i=>{const d=document.getElementById(i.id);if(d)d.classList.toggle('show',!!s.owned[i.id])});$('#catWrap').classList.toggle('show',!!s.owned.cat);const now=Date.now(),ready=now>=s.coolUntil,on=now<s.boostUntil;$('#cat').classList.toggle('ready',!!s.owned.cat&&ready&&!on);$('#cat').classList.toggle('sleep',!!s.owned.cat&&!ready&&!on);$('#boost').classList.toggle('show',on);renderQuick();renderShop();renderCollections();renderTasks();save()}function gain(n,x,y){n=Math.max(1,Math.floor(n));s.points+=n;s.total+=n;const f=document.createElement('div');f.className='float';f.textContent='+'+n;f.style.left=(x-12)+'px';f.style.top=(y-8)+'px';$('#app').appendChild(f);setTimeout(()=>f.remove(),1050);update()}function buy(id){const i=ITEMS.find(x=>x.id===id);if(!i||s.owned[id])return;if(s.points<i.cost){toast('Il manque '+fmt(i.cost-s.points)+' sérénité.');return}s.points-=i.cost;s.owned[id]=1;toast(id==='cat'?'🐈‍⬛ Loupiote a décidé que la pièce était à elle.':i.name+' rejoint le Cocon ✨');update()}function renderQuick(){const q=$('#quick');q.innerHTML='';ITEMS.slice(0,4).forEach(i=>{const b=document.createElement('button');b.className=(s.owned[i.id]?'owned':s.points<i.cost?'lock':'');b.innerHTML='<div class="qi">'+i.icon+'</div><div class="qn">'+i.name+'</div><div class="qc">'+(s.owned[i.id]?'installé':'✦ '+i.cost)+'</div>';b.onclick=()=>buy(i.id);q.appendChild(b)})}function renderShop(){const r=$('#shopList');r.innerHTML='';ITEMS.forEach(i=>{const d=document.createElement('div');d.className='card shopCard';d.innerHTML='<div class="shopEmoji">'+i.icon+'</div><div><h3>'+i.name+'</h3><div class="muted">'+i.bonus+'</div></div><button class="buy" '+(s.owned[i.id]||s.points<i.cost?'disabled':'')+'>'+(s.owned[i.id]?'Installé':'✦ '+i.cost)+'</button>';d.querySelector('button').onclick=()=>buy(i.id);r.appendChild(d)})}function renderCollections(){const r=$('#collectionList');r.innerHTML='';COLLECTIONS.forEach(c=>{if(c[3](s))s.collections[c[0]]=1;const ok=!!s.collections[c[0]],d=document.createElement('div');d.className='card collection';d.innerHTML='<div class="round">'+(ok?c[2]:'🔒')+'</div><div><b style="font-family:var(--serif)">'+(ok?c[1]:'À découvrir')+'</b><div class="muted">'+(ok?'un petit souvenir du Cocon':'continue doucement…')+'</div></div>';r.appendChild(d)})}function renderTasks(){const r=$('#taskList');r.innerHTML='';TASKS.forEach(t=>{const done=!!s.tasks[t[0]],available=t[5](s),d=document.createElement('div');d.className='card task';d.innerHTML='<div class="round">'+t[3]+'</div><div><b style="font-family:var(--serif)">'+t[1]+'</b><div class="muted">'+t[2]+' · +'+t[4]+'</div></div><button class="check" '+(!available||done?'disabled':'')+'>'+(done?'✓':'')+'</button>';d.querySelector('button').onclick=()=>{if(!available||done)return;s.tasks[t[0]]=1;s.points+=t[4];s.total+=t[4];toast(t[1]+' ✓  +'+t[4]);update()};r.appendChild(d)})}$('#tap').addEventListener('pointerup',e=>{const a=$('#app').getBoundingClientRect();s.taps++;gain(power()*(Date.now()<s.boostUntil?2:1),e.clientX-a.left,e.clientY-a.top)});$('#cat').addEventListener('pointerup',e=>{e.stopPropagation();if(Date.now()<s.coolUntil){toast('Loupiote fait une pause. Ses horaires sont non négociables. 😼');return}s.pets++;s.boostUntil=Date.now()+9000;s.coolUntil=Date.now()+29000;const h=document.createElement('div');h.className='heart';h.textContent='♥';h.style.left='64px';h.style.top='24px';$('#catWrap').appendChild(h);setTimeout(()=>h.remove(),1000);toast('Loupiote ronronne ×2 🐾');update()});$$('nav button').forEach(b=>b.onclick=()=>{$$('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.go));$$('nav button').forEach(x=>x.classList.toggle('active',x===b));update()});const WH=['chaque tape, un instant de calme','Loupiote travaille très dur à ne rien faire','dehors, tout peut attendre','un café, un livre, rien d’autre','ton Cocon se construit doucement'];let wi=0;setInterval(()=>{$('#whisper').textContent=WH[++wi%WH.length]},9000);setInterval(()=>{const n=pps()*2;if(n>0){s.points+=n;s.total+=n;update()}},2000);const away=Math.min(4*3600,(Date.now()-(s.last||Date.now()))/1000),offline=Math.floor(away*pps()*.75);if(offline>0){s.points+=offline;s.total+=offline;setTimeout(()=>toast('Pendant ton absence : +'+fmt(offline)+' sérénité'),500)}update();setInterval(update,900)})();
</script></body></html>
