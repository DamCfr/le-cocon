<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#2f3b2d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Le Cocon"><title>Le Cocon</title><style>
:root{--cream:#fff8ed;--linen:#f4ede1;--forest:#2f3b2d;--sage:#7c9473;--car:#c08a4e;--ink:#403328;--serif:Georgia,'Times New Roman',serif;--nav:74px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#1d211b;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--ink)}button{font:inherit;color:inherit}#app{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:var(--linen)}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}#home{background:#ba8f69}.room{position:absolute;inset:0 0 var(--nav);background:url('assets/room.webp') center 52%/cover no-repeat}.room:after{content:'';position:absolute;inset:0;background:linear-gradient(#3725161c,transparent 30%,#2e1f1718)}.tap{position:absolute;z-index:3;inset:0 0 145px;touch-action:manipulation}.top{position:absolute;z-index:15;top:max(env(safe-area-inset-top),7px);left:14px;right:14px;text-align:center;color:#fff6e8;text-shadow:0 2px 12px #452c1f99;pointer-events:none}.moon{font:600 18px var(--serif)}.title{font:600 clamp(36px,10vw,49px)/.95 var(--serif);margin:2px 0}.sub{font:500 13px var(--serif);margin:4px 0 8px}.score{pointer-events:auto;margin:auto;width:min(248px,69vw);height:57px;border-radius:30px;background:#fff8edf0;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #fff9;box-shadow:0 8px 24px #3824162b;text-shadow:none}.lotus{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#eddda0 0 25%,#d8a6a0 28% 49%,#aab99a 52% 66%,transparent 68%)}.score small{font:600 10px var(--serif);opacity:.7}.score b{font:600 27px/1 var(--serif);font-variant-numeric:tabular-nums}.boost{position:absolute;left:50%;transform:translateX(-50%);margin-top:5px;padding:5px 10px;border-radius:14px;background:#664934ed;color:#fff5e7;font:600 11px var(--serif);opacity:0;transition:.2s}.boost.show{opacity:1}.journalBtn{position:absolute;z-index:25;right:13px;top:max(calc(env(safe-area-inset-top) + 4px),8px);width:43px;height:43px;border:1px solid #fff7;border-radius:50%;background:#4d403ba3;color:#fff4df;display:grid;place-items:center;font:22px var(--serif);backdrop-filter:blur(9px)}.obj{position:absolute;z-index:5;display:none;object-fit:contain;pointer-events:none;opacity:0;transform:translateY(10px) scale(.9);transition:.55s cubic-bezier(.2,1.25,.35,1);filter:drop-shadow(0 12px 15px #39231335)}.obj.show{display:block;opacity:1;transform:none}#plant{left:4%;bottom:20%;width:25%}#sofa{left:22%;bottom:23%;width:50%;z-index:4}#books{right:9%;bottom:23%;width:22%}#lamp{right:2%;bottom:30%;width:19%}.catWrap{position:absolute;z-index:9;right:10%;bottom:17%;width:min(180px,42vw);display:none;pointer-events:none}.catWrap.show{display:block}.cat{width:100%;display:block;pointer-events:auto;filter:drop-shadow(0 15px 16px #39231355);transition:.14s}.cat:active{transform:scale(.94)}.catWrap.ready:before{content:'';position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#ffdfa466,transparent 64%);animation:pulse 1.8s infinite}.catWrap.ready:after{content:'✦  ✧  ✦';position:absolute;top:-6px;left:17%;right:7%;text-align:center;color:#ffe1a4;text-shadow:0 0 9px #ffd37b;font-size:18px;animation:pulse 1.4s infinite}.cat.sleep{opacity:.72;filter:saturate(.7) drop-shadow(0 12px 12px #39231344)}@keyframes pulse{50%{opacity:.35;transform:scale(1.05)}}.float{position:absolute;z-index:40;color:#fff8e9;font:600 21px var(--serif);text-shadow:0 2px 9px #422b1e;pointer-events:none;animation:up 1s ease-out forwards}@keyframes up{to{transform:translateY(-65px);opacity:0}}.homeBottom{position:absolute;z-index:14;left:8px;right:8px;bottom:calc(var(--nav) + 7px);pointer-events:none}.whisper{text-align:center;color:#fff2de;font:italic 14px var(--serif);text-shadow:0 2px 9px #452d1f;margin-bottom:7px}.quick{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;background:#fff8edf0;border-radius:19px;backdrop-filter:blur(9px);box-shadow:0 10px 25px #3521132b}.q{border:0;background:#ffffff3d;border-radius:12px;padding:4px 2px 6px;min-width:0}.q.lock{opacity:.43}.q.owned{opacity:.6}.q img{height:31px;max-width:48px;object-fit:contain}.qn{font:600 10px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qc{font-size:9px;font-weight:700;color:#775840;margin-top:2px}nav{position:absolute;z-index:50;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:#fff8edf7;border-top:1px solid #6e55351c;box-shadow:0 -6px 20px #39251718}nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 10px var(--serif);opacity:.57}nav button.active{opacity:1;color:#8a5b3e}.ni{font-size:21px;line-height:1}.secondary{background:var(--linen)}.hero{position:absolute;inset:0 0 48%;background:center/cover no-repeat;transform:scale(1.01)}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(#3a25191c,transparent 48%,#f4ede1 99%)}#shop .hero{background-image:url('assets/shop.webp')}#collections .hero{background-image:url('assets/collections.webp')}#tomorrow .hero{background-image:url('assets/tomorrow.webp')}.head{position:absolute;z-index:8;top:max(calc(env(safe-area-inset-top) + 10px),16px);left:15px;right:15px;text-align:center;color:#fff3df;text-shadow:0 2px 12px #332116bb}.head h2{font:600 clamp(39px,10vw,52px)/1 var(--serif);margin:4px}.head p{font:500 13px var(--serif);margin:0}.balance{display:inline-block;margin-top:7px;background:#fff8edf0;color:var(--ink);text-shadow:none;padding:6px 13px;border-radius:17px;font:600 13px var(--serif);box-shadow:0 6px 17px #39231333}.sheet{position:absolute;z-index:10;left:0;right:0;bottom:var(--nav);height:55%;background:linear-gradient(#fff8edf7,#f4ede1);border-radius:27px 27px 0 0;padding:14px 12px 20px;overflow:auto;box-shadow:0 -10px 24px #39231322}.cards{display:grid;gap:9px}.card{background:#fffdf9d9;border:1px solid #87987932;border-radius:17px;box-shadow:0 5px 14px #4a34200d}.shopCard{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:9px}.art{width:57px;height:57px;display:grid;place-items:center}.art img{max-width:57px;max-height:57px;object-fit:contain}.shopCard h3,.collection h3{font:600 16px var(--serif);margin:0 0 3px}.muted{font-size:11px;opacity:.62}.buy{border:0;border-radius:12px;background:var(--forest);color:#fff8ed;padding:8px 10px;font-size:11px;font-weight:700}.buy:disabled{opacity:.27}.collection{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;padding:11px}.badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#efe4d2;font:700 19px var(--serif);overflow:hidden}.badge img{width:48px;height:48px;object-fit:contain}.task{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center;padding:11px}.taskIcon{width:40px;height:40px;border-radius:50%;background:#efe4d2;display:grid;place-items:center;font:700 18px var(--serif)}.check{width:32px;height:32px;border:0;border-radius:50%;background:var(--sage);color:white;font-weight:900}.check:disabled{opacity:.28}.modal{position:absolute;z-index:100;inset:0;display:none;background:#2b1e16a8;backdrop-filter:blur(6px);padding:calc(env(safe-area-inset-top) + 55px) 15px calc(env(safe-area-inset-bottom) + 25px)}.modal.show{display:flex;align-items:center}.modalBox{width:100%;max-height:78vh;background:#fff8ed;border-radius:26px;padding:20px;box-shadow:0 20px 60px #0005;overflow:auto}.modalTop{display:flex;justify-content:space-between;align-items:center}.modal h2{font:600 32px var(--serif);margin:0}.close{border:0;background:#efe3d3;width:35px;height:35px;border-radius:50%;font-size:18px}.entry{padding:12px 0;border-bottom:1px solid #80674a20}.entry b{font:600 16px var(--serif)}.entry p{font-size:12px;opacity:.67;margin:4px 0}.toast{position:absolute;z-index:120;top:max(calc(env(safe-area-inset-top) + 10px),18px);left:50%;transform:translate(-50%,-15px);background:#2f3b2def;color:#fff8e9;border-radius:18px;padding:9px 15px;font:600 12px var(--serif);opacity:0;transition:.22s;white-space:nowrap;max-width:91%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div id="app"><section id="home" class="screen active"><div class="room"></div><div class="top"><div class="moon">☾</div><div class="title">Le Cocon</div><div class="sub">un petit monde plus doux</div><div class="score"><span class="lotus"></span><div><small>SÉRÉNITÉ</small><br><b id="score">0</b></div></div><div id="boost" class="boost">✦ ×2 · Loupiote ronronne</div></div><button id="journalBtn" class="journalBtn">▤</button><div id="tap" class="tap"></div><img id="plant" class="obj" src="assets/plant.webp"><img id="sofa" class="obj" src="assets/sofa.webp"><img id="books" class="obj" src="assets/books.webp"><img id="lamp" class="obj" src="assets/lamp.webp"><div id="catWrap" class="catWrap"><img id="cat" class="cat" src="assets/loupiote.webp"></div><div class="homeBottom"><div id="whisper" class="whisper">dehors, tout peut attendre</div><div id="quick" class="quick"></div></div></section><section id="shop" class="screen secondary"><div class="hero"></div><div class="head"><div class="moon">☾</div><h2>Boutique</h2><p>choisir de quoi embellir le Cocon</p><span class="balance">✦ <b class="mirror">0</b></span></div><div class="sheet"><div id="shopList" class="cards"></div></div></section><section id="collections" class="screen secondary"><div class="hero"></div><div class="head"><div class="moon">☾</div><h2>Collections</h2><p>les souvenirs qui donnent une âme au Cocon</p></div><div class="sheet"><div id="collectionList" class="cards"></div></div></section><section id="tomorrow" class="screen secondary"><div class="hero"></div><div class="head"><div class="moon">☾</div><h2>Demain</h2><p>pas une to-do, juste trois petits pas</p></div><div class="sheet"><div id="taskList" class="cards"></div></div></section><nav><button class="active" data-go="home"><span class="ni">⌂</span>Cocon</button><button data-go="shop"><span class="ni">♧</span>Boutique</button><button data-go="collections"><span class="ni">☆</span>Collections</button><button data-go="tomorrow"><span class="ni">☼</span>Demain</button></nav><div id="journal" class="modal"><div class="modalBox"><div class="modalTop"><h2>Journal</h2><button class="close">×</button></div><div id="journalList"></div></div></div><div id="toast" class="toast"></div></div><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],SAVE='le-cocon-web-v2';const ITEMS=[{id:'plant',name:'Plante verte',cost:40,art:'assets/plant.webp',passive:1/3,bonus:'+1 toutes les 3 s'},{id:'cat',name:'Loupiote',cost:80,art:'assets/loupiote.webp',bonus:'caresse-la : gains ×2'},{id:'sofa',name:'Canapé confortable',cost:150,art:'assets/sofa.webp',tap:1,bonus:'+1 par tape'},{id:'books',name:'Pile de livres',cost:300,art:'assets/books.webp',passive:.5,bonus:'+2 toutes les 4 s'},{id:'lamp',name:'Lampe du soir',cost:500,art:'assets/lamp.webp',passive:.2,bonus:'une lumière douce'}];const COL=[['first','Premier souffle','☾',s=>s.totalEarned>=1],['plant','Ça pousse','assets/plant.webp',s=>s.owned.plant],['cat','Employée du mois','assets/loupiote.webp',s=>s.owned.cat],['books','Lecteur du soir','assets/books.webp',s=>s.owned.books],['nest','Ça ressemble à chez toi','☆',s=>Object.keys(s.owned).length>=4]];const TASK=[['tap','Prendre un moment','taper 20 fois',30,s=>s.taps>=20],['cat','Caresser Loupiote','quand madame est disponible',50,s=>s.petCount>=1],['buy','Ajouter une douceur','installer 3 objets',75,s=>Object.keys(s.owned).length>=3]];let s={points:0,totalEarned:0,taps:0,petCount:0,owned:{},collections:{},tasks:{},journal:[],boostUntil:0,catCooldownUntil:0,lastSeen:Date.now()};try{const x=JSON.parse(localStorage.getItem(SAVE));if(x){s={...s,...x,owned:x.owned||{},collections:x.collections||{},tasks:x.tasks?.done||x.tasks||{},journal:x.journal||[]};if(!s.totalEarned&&x.total)s.totalEarned=x.total;if(!s.petCount&&x.pets)s.petCount=x.pets;if(!s.catCooldownUntil&&x.coolUntil)s.catCooldownUntil=x.coolUntil}}catch(e){}const fmt=n=>Math.floor(n).toLocaleString('fr-FR'),pps=()=>ITEMS.reduce((a,i)=>a+(s.owned[i.id]?(i.passive||0):0),0),power=()=>1+ITEMS.reduce((a,i)=>a+(s.owned[i.id]?(i.tap||0):0),0);function save(){s.lastSeen=Date.now();localStorage.setItem(SAVE,JSON.stringify(s))}let to;function toast(t){clearTimeout(to);$('#toast').textContent=t;$('#toast').classList.add('show');to=setTimeout(()=>$('#toast').classList.remove('show'),2400)}function log(title,text){if(s.journal.some(e=>e.title===title))return;s.journal.unshift({title,text,date:new Date().toLocaleDateString('fr-FR')})}function gain(n,x,y){n=Math.max(1,Math.floor(n));s.points+=n;s.totalEarned+=n;s.taps++;const f=document.createElement('div');f.className='float';f.textContent='+'+n;f.style.left=(x-12)+'px';f.style.top=(y-8)+'px';$('#app').appendChild(f);setTimeout(()=>f.remove(),1050);update()}function buy(id){const i=ITEMS.find(x=>x.id===id);if(!i||s.owned[id])return;if(s.points<i.cost){toast('Il manque '+fmt(i.cost-s.points)+' sérénité.');return}s.points-=i.cost;s.owned[id]=1;log(i.name,id==='cat'?'Loupiote a inspecté la pièce. Verdict : elle reste.':i.name+' a trouvé sa place dans le Cocon.');toast(id==='cat'?'Loupiote a décidé que la pièce était à elle.':'Une douceur de plus dans le Cocon ✦');update()}function art(icon){return icon.includes('/')?'<img src="'+icon+'">':icon}function render(){const q=$('#quick');q.innerHTML='';ITEMS.slice(0,4).forEach(i=>{const b=document.createElement('button');b.className='q '+(s.owned[i.id]?'owned':s.points<i.cost?'lock':'');b.innerHTML='<div><img src="'+i.art+'"></div><div class="qn">'+i.name+'</div><div class="qc">'+(s.owned[i.id]?'installé':'✦ '+i.cost)+'</div>';b.onclick=()=>buy(i.id);q.appendChild(b)});const sh=$('#shopList');sh.innerHTML='';ITEMS.forEach(i=>{const d=document.createElement('div');d.className='card shopCard';d.innerHTML='<div class="art"><img src="'+i.art+'"></div><div><h3>'+i.name+'</h3><div class="muted">'+i.bonus+'</div></div><button class="buy" '+(s.owned[i.id]||s.points<i.cost?'disabled':'')+'>'+(s.owned[i.id]?'Installé':'✦ '+i.cost)+'</button>';d.querySelector('button').onclick=()=>buy(i.id);sh.appendChild(d)});const c=$('#collectionList');c.innerHTML='';COL.forEach(v=>{if(v[3](s))s.collections[v[0]]=1;const ok=!!s.collections[v[0]],d=document.createElement('div');d.className='card collection';d.innerHTML='<div class="badge">'+(ok?art(v[2]):'⋯')+'</div><div><h3>'+(ok?v[1]:'À découvrir')+'</h3><div class="muted">'+(ok?'un petit souvenir du Cocon':'continue doucement…')+'</div></div>';c.appendChild(d)});const t=$('#taskList');t.innerHTML='';TASK.forEach(v=>{const done=!!s.tasks[v[0]],avail=v[4](s),d=document.createElement('div');d.className='card task';d.innerHTML='<div class="taskIcon">'+(v[0]==='cat'?'♡':v[0]==='buy'?'✧':'☕')+'</div><div><h3 style="font:600 16px var(--serif);margin:0">'+v[1]+'</h3><div class="muted">'+v[2]+' · +'+v[3]+'</div></div><button class="check" '+(!avail||done?'disabled':'')+'>'+(done?'✓':'')+'</button>';d.querySelector('button').onclick=()=>{if(!avail||done)return;s.tasks[v[0]]=1;s.points+=v[3];s.totalEarned+=v[3];toast(v[1]+' ✓  +'+v[3]);update()};t.appendChild(d)});const j=$('#journalList');j.innerHTML=s.journal.length?s.journal.map(e=>'<div class="entry"><b>'+e.title+'</b><p>'+e.text+'</p><small>'+e.date+'</small></div>').join(''):'<div class="entry"><b>Le premier soir</b><p>Le journal se remplira tout seul à mesure que ton Cocon prendra vie.</p></div>'}function update(){const n=fmt(s.points);$('#score').textContent=n;$$('.mirror').forEach(x=>x.textContent=n);['plant','sofa','books','lamp'].forEach(id=>$('#'+id).classList.toggle('show',!!s.owned[id]));$('#catWrap').classList.toggle('show',!!s.owned.cat);const now=Date.now(),on=now<s.boostUntil,ready=now>=s.catCooldownUntil;$('#catWrap').classList.toggle('ready',!!s.owned.cat&&ready&&!on);$('#cat').classList.toggle('sleep',!!s.owned.cat&&!ready&&!on);$('#boost').classList.toggle('show',on);render();save()}$('#tap').addEventListener('pointerup',e=>{const r=$('#app').getBoundingClientRect();gain(power()*(Date.now()<s.boostUntil?2:1),e.clientX-r.left,e.clientY-r.top)});$('#cat').addEventListener('pointerup',e=>{e.stopPropagation();if(Date.now()<s.catCooldownUntil){toast('Loupiote fait une pause. Ses horaires sont non négociables.');return}s.petCount++;s.boostUntil=Date.now()+9000;s.catCooldownUntil=Date.now()+29000;log('Un ronronnement','Pendant neuf secondes, le Cocon a tourné deux fois plus doux.');toast('Loupiote ronronne ×2 ♡');update()});$$('nav button').forEach(b=>b.onclick=()=>{$$('.screen').forEach(x=>x.classList.toggle('active',x.id===b.dataset.go));$$('nav button').forEach(x=>x.classList.toggle('active',x===b));update()});$('#journalBtn').onclick=()=>{$('#journal').classList.add('show');render()};$('.close').onclick=()=>$('#journal').classList.remove('show');$('#journal').onclick=e=>{if(e.target===$('#journal'))$('#journal').classList.remove('show')};const WH=['dehors, tout peut attendre','Loupiote travaille très dur à ne rien faire','un café, un livre, rien d’autre','ton Cocon se construit doucement','les plantes poussent, le temps passe doucement'];let wi=0;setInterval(()=>$('#whisper').textContent=WH[++wi%WH.length],8500);setInterval(()=>{const n=pps()*2;if(n>0){s.points+=n;s.totalEarned+=n;update()}},2000);const away=Math.min(4*3600,(Date.now()-(s.lastSeen||Date.now()))/1000),off=Math.floor(away*pps()*.75);if(off>0){s.points+=off;s.totalEarned+=off;setTimeout(()=>toast('Pendant ton absence : +'+off+' sérénité'),600)}update();setInterval(update,1000)})();</script></body></html>
